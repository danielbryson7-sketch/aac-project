<!doctype html>
<html lang="en">
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <style>
      :root {
        --b: #f2f5fa;
        --p: #fff;
        --t: #172033;
        --m: #617087;
        --l: #c8d2e3;
        --a: #1859c9;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--b);
        color: var(--t);
        font-family: system-ui, sans-serif;
      }
      button,
      select,
      input {
        font: inherit;
      }
      button {
        touch-action: manipulation;
      }
      button:focus-visible {
        outline: 4px solid #ffbd3e;
        outline-offset: 2px;
      }
      .app {
        max-width: 1150px;
        margin: auto;
        padding: 10px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .top h1 {
        margin: 0;
      }
      .settings {
        min-width: 54px;
        min-height: 54px;
        border: 2px solid var(--l);
        border-radius: 14px;
        background: var(--p);
        font-size: 24px;
      }
      .composer {
        position: sticky;
        top: 0;
        z-index: 2;
        margin: 10px 0;
        padding: 10px;
        border: 2px solid var(--l);
        border-radius: 16px;
        background: var(--p);
      }
      .message {
        min-height: 70px;
        padding: 12px;
        border: 2px solid var(--l);
        border-radius: 12px;
        background: var(--b);
        font-size: clamp(22px, 4vw, 34px);
        font-weight: 750;
      }
      .muted {
        color: var(--m);
        font-weight: 500;
      }
      .actions {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-top: 8px;
      }
      .action,
      .cat {
        min-height: 52px;
        border: 2px solid var(--l);
        border-radius: 11px;
        background: #e5ebf5;
        font-weight: 800;
      }
      .speak,
      .cat.on {
        border-color: var(--a);
        background: var(--a);
        color: #fff;
      }
      .cats {
        display: flex;
        gap: 8px;
        overflow: auto;
        padding-bottom: 10px;
      }
      .cat {
        flex: none;
        padding: 8px 18px;
        background: var(--p);
      }
      .board {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 10px;
      }
      .word {
        min-height: 130px;
        border: 3px solid #5575c9;
        border-radius: 17px;
        background: var(--p);
        color: var(--t);
      }
      .sym {
        display: block;
        font-size: 48px;
      }
      .large .lab {
        font-size: clamp(24px, 4vw, 32px);
      }
      .lab {
        font-size: clamp(18px, 3vw, 24px);
        font-weight: 850;
      }
      button:disabled {
        opacity: 0.4;
      }
      @media (max-width: 620px) {
        .actions,
        .board {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --b: #111827;
          --p: #1f2937;
          --t: #f5f7fb;
          --m: #bbc5d6;
          --l: #56647b;
          --a: #76a7ff;
        }
        .speak,
        .cat.on {
          color: #071a39;
        }
        .action {
          background: #303d51;
        }
      }
      .customize {
        width: min(560px, calc(100% - 24px));
        border: 0;
        border-radius: 18px;
        padding: 0;
        background: var(--p);
        color: var(--t);
      }
      .customize::backdrop {
        background: #081122aa;
      }
      .panel {
        display: grid;
        gap: 13px;
        padding: 18px;
      }
      .panel h2,
      .panel h3 {
        margin: 0;
      }
      .panel label {
        display: grid;
        gap: 5px;
        font-weight: 750;
      }
      .panel input,
      .panel select {
        width: 100%;
        min-height: 48px;
        padding: 8px;
        border: 2px solid var(--l);
        border-radius: 9px;
        background: var(--b);
        color: var(--t);
      }
      .formgrid {
        display: grid;
        grid-template-columns: 1fr 90px 1fr;
        gap: 9px;
      }
      .panelbuttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .customitem {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 7px;
        border: 1px solid var(--l);
        border-radius: 8px;
      }
      .customitem button {
        min-height: 42px;
        border: 1px solid var(--l);
        border-radius: 8px;
        color: var(--danger);
        background: var(--b);
      }
      .customlist {
        display: grid;
        gap: 6px;
        max-height: 150px;
        overflow: auto;
      }
      .toggle {
        display: flex !important;
        grid-template-columns: 1fr auto !important;
        align-items: center;
      }
      .toggle input {
        width: 28px;
        height: 28px;
      }
      .hint {
        margin: 0;
        color: var(--m);
        font-size: 0.9rem;
      }
      @media (max-width: 560px) {
        .formgrid {
          grid-template-columns: 1fr 80px;
        }
        .formgrid label:last-child {
          grid-column: 1/-1;
        }
      }
      .wordimg {
        display: block;
        width: 64px;
        height: 64px;
        margin: auto;
        object-fit: cover;
        border-radius: 12px;
      }
      .mediafields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .backuprow {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .filelabel {
        display: grid;
        gap: 5px;
        font-weight: 750;
      }
      .filelabel input {
        font-size: 0.85rem;
      }
      @media (max-width: 560px) {
        .mediafields,
        .backuprow {
          grid-template-columns: 1fr;
        }
      }
      .confirmbox {
        width: min(420px, calc(100% - 24px));
        border: 0;
        border-radius: 18px;
        padding: 0;
        background: var(--p);
        color: var(--t);
      }
      .confirmbody {
        display: grid;
        gap: 16px;
        padding: 20px;
      }
      .confirmbody h2,
      .confirmbody p {
        margin: 0;
      }
      .confirmbuttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        z-index: 20;
        transform: translateX(-50%);
        max-width: calc(100% - 24px);
        padding: 12px 18px;
        border-radius: 999px;
        background: #172033;
        color: #fff;
        font-weight: 750;
        box-shadow: 0 5px 20px #0005;
      }
      .toast[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="top">
        <div>
          <small>Communication belongs to the communicator</small>
          <h1>My Voice</h1>
        </div>
        <button class="settings" id="settings" aria-label="Voice settings">
          ⚙
        </button>
      </header>
      <section class="composer" aria-label="Message composer">
        <div class="message" id="message" aria-live="polite"></div>
        <div class="actions">
          <button class="action speak" id="speak">🔊 Speak</button
          ><button class="action" id="undo">↶ Undo</button
          ><button class="action" id="del">⌫ Delete</button
          ><button class="action" id="clear">× Clear</button>
        </div>
      </section>
      <nav class="cats" id="cats" aria-label="Word categories"></nav>
      <section
        class="board"
        id="board"
        aria-label="Communication words"
      ></section>
    </main>
    <dialog class="customize" id="customize">
      <div class="panel">
        <div class="top">
          <h2>Personalize</h2>
          <button
            class="settings"
            id="closeSettings"
            aria-label="Close settings"
          >
            ×
          </button>
        </div>
        <label
          >Voice<select id="voice">
            <option value="">Automatic</option>
          </select></label
        ><label
          >Speaking speed <output id="rateOut">1.0</output
          ><input
            id="rate"
            type="range"
            min=".5"
            max="1.5"
            step=".1"
            value="1" /></label
        ><label class="toggle"
          >Extra-large word labels<input id="large" type="checkbox"
        /></label>
        <hr />
        <h3>Add a personal word</h3>
        <div class="formgrid">
          <label
            >Word or phrase<input
              id="customLabel"
              maxlength="40"
              placeholder="Grandma" /></label
          ><label
            >Symbol<input
              id="customSymbol"
              maxlength="8"
              placeholder="👵" /></label
          ><label
            >Category<select id="customCategory">
              <option>Core</option>
              <option>Needs</option>
              <option>Feelings</option>
              <option>Actions</option>
            </select></label
          >
        </div>
        <div class="mediafields">
          <div class="filelabel">
            <strong>Photo</strong
            ><button class="action" id="takePhoto" type="button">
              📷 Take picture</button
            ><button class="action" id="choosePhoto" type="button">
              Choose photo file</button
            ><input
              id="customPhoto"
              type="file"
              accept="image/*"
              capture="environment"
              hidden
            /><span class="hint" id="photoStatus">No photo selected.</span>
          </div>
          <div class="filelabel">
            <strong>Voice recording</strong
            ><button class="action" id="recordAudio" type="button">
              🎙️ Start recording</button
            ><button class="action" id="chooseAudio" type="button">
              Choose audio file</button
            ><input
              id="customAudio"
              type="file"
              accept="audio/*"
              capture
              hidden
            /><span class="hint" id="audioStatus">No audio selected.</span>
          </div>
        </div>
        <div class="backuprow">
          <button class="action" id="clearPhoto" type="button">
            Clear photo</button
          ><button class="action" id="clearAudio" type="button">
            Clear audio
          </button>
        </div>
        <button class="action speak" id="addCustom">＋ Add word</button>
        <p id="addStatus" class="hint" role="status" aria-live="polite"></p>
        <p class="hint">
          Personal words and settings stay only in this tablet browser.
        </p>
        <div class="customlist" id="customList"></div>
        <h3>Backup and restore</h3>
        <div class="backuprow">
          <button class="action" id="backupProfile">Download backup</button
          ><label class="action"
            >Restore backup<input
              id="restoreProfile"
              type="file"
              accept="application/json"
              hidden
          /></label>
        </div>
        <div class="panelbuttons">
          <button class="action" id="resetCustom">Remove personal words</button
          ><button class="action speak" id="doneSettings">Done</button>
        </div>
      </div>
    </dialog>
    <dialog class="confirmbox" id="cameraDialog">
      <div class="confirmbody">
        <h2>Take a picture</h2>
        <video
          id="cameraPreview"
          autoplay
          playsinline
          style="
            width: 100%;
            max-height: 55vh;
            border-radius: 14px;
            background: #000;
          "
        ></video>
        <div class="confirmbuttons">
          <button class="action" id="cancelCamera" type="button">Cancel</button
          ><button class="action speak" id="capturePhoto" type="button">
            Take picture
          </button>
        </div>
      </div>
    </dialog>
    <dialog class="confirmbox" id="confirmDialog">
      <div class="confirmbody">
        <h2>Confirm action</h2>
        <p id="confirmMessage"></p>
        <div class="confirmbuttons">
          <button class="action" id="confirmCancel">Cancel</button
          ><button class="action speak" id="confirmOkay">Confirm</button>
        </div>
      </div>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script>
      (function () {
        "use strict";
        var data = {
          Core: [
            ["I", "👤"],
            ["you", "👉"],
            ["want", "🙋"],
            ["not", "🚫"],
            ["more", "➕"],
            ["different", "🔄"],
            ["help", "🛟"],
            ["stop", "🛑"],
            ["yes", "✅"],
            ["no", "❌"],
            ["like", "👍"],
            ["don't like", "👎"],
          ],
          Needs: [
            ["eat", "🍽️"],
            ["drink", "🥤"],
            ["bathroom", "🚻"],
            ["break", "⏸️"],
            ["quiet", "🤫"],
            ["space", "↔️"],
            ["hurt", "🩹"],
            ["too loud", "🔇"],
          ],
          Feelings: [
            ["happy", "😊"],
            ["sad", "😢"],
            ["angry", "😠"],
            ["scared", "😨"],
            ["tired", "😴"],
            ["overwhelmed", "🌪️"],
            ["okay", "🙂"],
            ["excited", "🤩"],
          ],
          Actions: [
            ["go", "➡️"],
            ["come", "⬅️"],
            ["play", "🧸"],
            ["look", "👀"],
            ["listen", "👂"],
            ["make", "🧩"],
            ["open", "📂"],
            ["finished", "🏁"],
          ],
        };
        var key = "my-voice-aac-v1",
          state = {
            words: [],
            cat: "Core",
            custom: [],
            voice: "",
            rate: 1,
            large: false,
          },
          history = [];
        try {
          state = Object.assign(
            state,
            JSON.parse(localStorage.getItem(key) || "{}"),
          );
        } catch (e) {}
        if (!Array.isArray(state.custom)) state.custom = [];
        var msg = document.getElementById("message"),
          board = document.getElementById("board"),
          cats = document.getElementById("cats"),
          speak = document.getElementById("speak"),
          del = document.getElementById("del"),
          undo = document.getElementById("undo"),
          clear = document.getElementById("clear");
        function save() {
          localStorage.setItem(key, JSON.stringify(state));
        }
        function renderMessage() {
          msg.innerHTML = state.words.length
            ? ""
            : '<span class="muted">Choose words below</span>';
          if (state.words.length) msg.textContent = state.words.join(" ");
          speak.disabled = del.disabled = clear.disabled = !state.words.length;
          undo.disabled = !history.length;
          save();
        }
        function renderCats() {
          cats.innerHTML = "";
          Object.keys(data).forEach(function (name) {
            var b = document.createElement("button");
            b.className = "cat" + (name === state.cat ? " on" : "");
            b.textContent = name;
            b.onclick = function () {
              state.cat = name;
              renderCats();
              renderBoard();
              save();
            };
            cats.appendChild(b);
          });
        }
        function renderBoard() {
          board.innerHTML = "";
          (data[state.cat] || [])
            .concat(
              state.custom
                .filter(function (x) {
                  return x.cat === state.cat;
                })
                .map(function (x) {
                  return [x.label, x.photo || x.symbol, x.audio || "", x.id];
                }),
            )
            .forEach(function (w) {
              var b = document.createElement("button");
              b.className = "word";
              b.setAttribute("aria-label", "Add " + w[0]);
              var s;
              if (
                typeof w[1] === "string" &&
                w[1].indexOf("data:image/") === 0
              ) {
                s = document.createElement("img");
                s.className = "wordimg";
                s.src = w[1];
                s.alt = "";
              } else {
                s = document.createElement("span");
                s.className = "sym";
                s.setAttribute("aria-hidden", "true");
                s.textContent = w[1];
              }
              var l = document.createElement("span");
              l.className = "lab";
              l.textContent = w[0];
              b.appendChild(s);
              b.appendChild(l);
              b.onclick = function () {
                history.push(state.words.slice());
                state.words.push(w[0]);
                renderMessage();
                if (w[2]) {
                  var a = new Audio(w[2]);
                  a.play().catch(function () {
                    say(w[0], false);
                  });
                } else say(w[0], false);
              };
              board.appendChild(b);
            });
        }
        function say(text, interrupt) {
          if (!text || !("speechSynthesis" in window)) return;
          if (interrupt) speechSynthesis.cancel();
          var u = new SpeechSynthesisUtterance(text.replace(/\?$/, "")),
            v = speechSynthesis.getVoices().find(function (x) {
              return x.voiceURI === state.voice;
            });
          if (v) u.voice = v;
          u.rate = Number(state.rate) || 1;
          speechSynthesis.speak(u);
        }
        speak.onclick = function () {
          say(state.words.join(" "), true);
        };
        del.onclick = function () {
          if (state.words.length) {
            history.push(state.words.slice());
            state.words.pop();
            renderMessage();
          }
        };
        undo.onclick = function () {
          if (history.length) {
            state.words = history.pop();
            renderMessage();
          }
        };
        clear.onclick = function () {
          if (state.words.length)
            ask("Clear the whole message?", function () {
              history.push(state.words.slice());
              state.words = [];
              speechSynthesis.cancel();
              renderMessage();
            });
        };
        var dialog = document.getElementById("customize"),
          voice = document.getElementById("voice"),
          rate = document.getElementById("rate"),
          rateOut = document.getElementById("rateOut"),
          large = document.getElementById("large"),
          customList = document.getElementById("customList");
        function loadVoices() {
          if (!("speechSynthesis" in window)) return;
          var vs = speechSynthesis.getVoices().filter(function (v) {
            return v.lang.toLowerCase().indexOf("en") === 0;
          });
          voice.innerHTML = '<option value="">Automatic</option>';
          vs.forEach(function (v) {
            var o = document.createElement("option");
            o.value = v.voiceURI;
            o.textContent = v.name + " (" + v.lang + ")";
            voice.appendChild(o);
          });
          voice.value = state.voice || "";
        }
        function renderCustom() {
          customList.innerHTML = "";
          state.custom.forEach(function (w, i) {
            var row = document.createElement("div");
            row.className = "customitem";
            var name = document.createElement("span");
            name.textContent = w.symbol + " " + w.label + " · " + w.cat;
            var remove = document.createElement("button");
            remove.textContent = "Remove";
            remove.onclick = function () {
              state.custom.splice(i, 1);
              save();
              renderCustom();
              renderBoard();
            };
            row.appendChild(name);
            row.appendChild(remove);
            customList.appendChild(row);
          });
          if (!state.custom.length)
            customList.textContent = "No personal words yet.";
        }
        document.getElementById("settings").onclick = function () {
          loadVoices();
          renderCustom();
          dialog.showModal();
        };
        document.getElementById("closeSettings").onclick = function () {
          dialog.close();
        };
        document.getElementById("doneSettings").onclick = function () {
          dialog.close();
        };
        var pendingConfirm = null,
          confirmDialog = document.getElementById("confirmDialog"),
          confirmMessage = document.getElementById("confirmMessage"),
          toast = document.getElementById("toast"),
          toastTimer;
        function ask(message, action) {
          pendingConfirm = action;
          confirmMessage.textContent = message;
          confirmDialog.showModal();
        }
        document.getElementById("confirmCancel").onclick = function () {
          pendingConfirm = null;
          confirmDialog.close();
        };
        document.getElementById("confirmOkay").onclick = function () {
          var action = pendingConfirm;
          pendingConfirm = null;
          confirmDialog.close();
          if (action) action();
        };
        function notify(message) {
          toast.textContent = message;
          toast.hidden = false;
          clearTimeout(toastTimer);
          toastTimer = setTimeout(function () {
            toast.hidden = true;
          }, 3500);
        }
        function readData(input, max, label) {
          return new Promise(function (resolve, reject) {
            var file = input.files && input.files[0];
            if (!file) return resolve("");
            if (file.size > max)
              return reject(
                new Error(label + " is too large. Choose a smaller file."),
              );
            var reader = new FileReader();
            reader.onload = function () {
              resolve(reader.result);
            };
            reader.onerror = function () {
              reject(new Error(label + " could not be read."));
            };
            reader.readAsDataURL(file);
          });
        }
        document.getElementById("backupProfile").onclick = function () {
          var blob = new Blob(
              [
                JSON.stringify(
                  { format: "my-voice-profile", version: 1, state: state },
                  null,
                  2,
                ),
              ],
              { type: "application/json" },
            ),
            url = URL.createObjectURL(blob),
            a = document.createElement("a");
          a.href = url;
          a.download = "my-voice-profile.json";
          a.click();
          setTimeout(function () {
            URL.revokeObjectURL(url);
          }, 1000);
        };
        document.getElementById("restoreProfile").onchange = function (event) {
          var file = event.target.files[0];
          if (!file) return;
          var reader = new FileReader();
          reader.onload = function () {
            try {
              var backup = JSON.parse(reader.result);
              if (backup.format !== "my-voice-profile" || !backup.state)
                throw new Error("Not a My Voice profile backup.");
              state = Object.assign(
                {
                  words: [],
                  cat: "Core",
                  custom: [],
                  voice: "",
                  rate: 1,
                  large: false,
                },
                backup.state,
              );
              if (!Array.isArray(state.custom))
                throw new Error("Backup profile is damaged.");
              save();
              renderCats();
              renderBoard();
              renderMessage();
              renderCustom();
              notify("Profile restored.");
            } catch (error) {
              notify(error.message);
            }
          };
          reader.readAsText(file);
        };
        var cameraStream = null,
          mediaRecorder = null,
          audioChunks = [];
        var photoInput = document.getElementById("customPhoto"),
          audioInput = document.getElementById("customAudio"),
          photoStatus = document.getElementById("photoStatus"),
          audioStatus = document.getElementById("audioStatus"),
          cameraDialog = document.getElementById("cameraDialog"),
          cameraPreview = document.getElementById("cameraPreview");
        function stopCamera() {
          if (cameraStream) {
            cameraStream.getTracks().forEach(function (track) {
              track.stop();
            });
            cameraStream = null;
          }
          cameraPreview.srcObject = null;
        }
        document.getElementById("choosePhoto").onclick = function () {
          photoInput.click();
        };
        document.getElementById("chooseAudio").onclick = function () {
          audioInput.click();
        };
        photoInput.onchange = function () {
          photoInput._capturedData = "";
          photoStatus.textContent =
            photoInput.files && photoInput.files[0]
              ? "Selected: " + photoInput.files[0].name
              : "No photo selected.";
        };
        audioInput.onchange = function () {
          audioInput._capturedData = "";
          audioStatus.textContent =
            audioInput.files && audioInput.files[0]
              ? "Selected: " + audioInput.files[0].name
              : "No audio selected.";
        };
        document.getElementById("takePhoto").onclick = function () {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            photoStatus.textContent =
              "Camera capture is unavailable here. Use Choose photo file.";
            return;
          }
          navigator.mediaDevices
            .getUserMedia({
              video: { facingMode: { ideal: "environment" } },
              audio: false,
            })
            .then(function (stream) {
              cameraStream = stream;
              cameraPreview.srcObject = stream;
              cameraDialog.showModal();
            })
            .catch(function () {
              photoStatus.textContent =
                "Camera permission was not granted. Use Choose photo file.";
            });
        };
        document.getElementById("cancelCamera").onclick = function () {
          stopCamera();
          cameraDialog.close();
        };
        document.getElementById("capturePhoto").onclick = function () {
          var width = cameraPreview.videoWidth || 800,
            height = cameraPreview.videoHeight || 600,
            scale = Math.min(1, 800 / width),
            canvas = document.createElement("canvas");
          canvas.width = Math.round(width * scale);
          canvas.height = Math.round(height * scale);
          canvas
            .getContext("2d")
            .drawImage(cameraPreview, 0, 0, canvas.width, canvas.height);
          photoInput._capturedData = canvas.toDataURL("image/jpeg", 0.72);
          photoInput.value = "";
          photoStatus.textContent = "New picture captured.";
          stopCamera();
          cameraDialog.close();
        };
        document.getElementById("recordAudio").onclick = function () {
          var button = this;
          if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
            return;
          }
          if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia ||
            !window.MediaRecorder
          ) {
            audioStatus.textContent =
              "In-browser recording is unavailable here. Use Choose audio file.";
            return;
          }
          navigator.mediaDevices
            .getUserMedia({ audio: true })
            .then(function (stream) {
              audioChunks = [];
              mediaRecorder = new MediaRecorder(stream);
              mediaRecorder.ondataavailable = function (event) {
                if (event.data.size) audioChunks.push(event.data);
              };
              mediaRecorder.onstop = function () {
                stream.getTracks().forEach(function (track) {
                  track.stop();
                });
                var blob = new Blob(audioChunks, {
                    type: mediaRecorder.mimeType || "audio/webm",
                  }),
                  reader = new FileReader();
                reader.onload = function () {
                  audioInput._capturedData = reader.result;
                  audioInput.value = "";
                  audioStatus.textContent = "New voice recording captured.";
                  button.textContent = "🎙️ Start recording";
                };
                reader.readAsDataURL(blob);
              };
              mediaRecorder.start();
              button.textContent = "⏹ Stop recording";
              audioStatus.textContent = "Recording… Tap Stop when finished.";
              setTimeout(function () {
                if (mediaRecorder && mediaRecorder.state === "recording")
                  mediaRecorder.stop();
              }, 10000);
            })
            .catch(function () {
              audioStatus.textContent =
                "Microphone permission was not granted. Use Choose audio file.";
            });
        };
        document.getElementById("clearPhoto").onclick = function () {
          photoInput.value = "";
          photoInput._capturedData = "";
          photoStatus.textContent = "No photo selected.";
          document.getElementById("addStatus").textContent =
            "Photo selection cleared.";
        };
        document.getElementById("clearAudio").onclick = function () {
          if (mediaRecorder && mediaRecorder.state === "recording")
            mediaRecorder.stop();
          audioInput.value = "";
          audioInput._capturedData = "";
          audioStatus.textContent = "No audio selected.";
          document.getElementById("recordAudio").textContent =
            "🎙️ Start recording";
          document.getElementById("addStatus").textContent =
            "Audio selection cleared.";
        };
        document.getElementById("addCustom").onclick = function () {
          var label = document.getElementById("customLabel"),
            symbol = document.getElementById("customSymbol"),
            cat = document.getElementById("customCategory"),
            status = document.getElementById("addStatus"),
            photoInput = document.getElementById("customPhoto"),
            audioInput = document.getElementById("customAudio");
          status.textContent = "";
          if (!label.value.trim()) {
            status.textContent = "Enter a word or phrase first.";
            label.focus();
            return;
          }
          function optionalMedia(input, max, name) {
            return new Promise(function (resolve) {
              if (input._capturedData) {
                var capturedBytes = Math.ceil(
                  (input._capturedData.length * 3) / 4,
                );
                if (capturedBytes > max)
                  return resolve({
                    data: "",
                    warning:
                      name +
                      " was too large and was skipped. Keep it under " +
                      Math.round(max / 1000) +
                      " KB.",
                  });
                return resolve({ data: input._capturedData, warning: "" });
              }
              var file = input.files && input.files[0];
              if (!file) return resolve({ data: "", warning: "" });
              if (file.size > max)
                return resolve({
                  data: "",
                  warning:
                    name +
                    " was too large and was skipped. Use a file under " +
                    Math.round(max / 1000) +
                    " KB.",
                });
              var reader = new FileReader();
              reader.onload = function () {
                resolve({ data: reader.result, warning: "" });
              };
              reader.onerror = function () {
                resolve({
                  data: "",
                  warning: name + " could not be read and was skipped.",
                });
              };
              reader.readAsDataURL(file);
            });
          }
          Promise.all([
            optionalMedia(photoInput, 800000, "Photo"),
            optionalMedia(audioInput, 2000000, "Recording"),
          ]).then(function (media) {
            var word = {
              id: "custom-" + Date.now(),
              label: label.value.trim(),
              symbol: symbol.value.trim() || "💬",
              cat: cat.value,
              photo: media[0].data,
              audio: media[1].data,
            };
            state.custom.push(word);
            try {
              save();
            } catch (error) {
              state.custom.pop();
              photoInput.value = "";
              audioInput.value = "";
              photoInput._capturedData = "";
              audioInput._capturedData = "";
              photoStatus.textContent = "No photo selected.";
              audioStatus.textContent = "No audio selected.";
              status.textContent =
                "This browser is out of storage space. Try shorter audio, a smaller photo, or download a backup and remove unused personal words.";
              return;
            }
            label.value = "";
            symbol.value = "";
            photoInput.value = "";
            audioInput.value = "";
            photoInput._capturedData = "";
            audioInput._capturedData = "";
            photoStatus.textContent = "No photo selected.";
            audioStatus.textContent = "No audio selected.";
            renderCustom();
            state.cat = cat.value;
            renderCats();
            renderBoard();
            var warnings = media
              .map(function (item) {
                return item.warning;
              })
              .filter(Boolean);
            status.textContent =
              "✓ Added " +
              word.label +
              " to " +
              cat.value +
              "." +
              (warnings.length ? " " + warnings.join(" ") : "");
            notify(
              warnings.length
                ? "Word added without oversized media."
                : "Added " + word.label + " to " + cat.value,
            );
          });
        };
        document.getElementById("resetCustom").onclick = function () {
          if (state.custom.length)
            ask("Remove all personal words from this tablet?", function () {
              state.custom = [];
              save();
              renderCustom();
              renderBoard();
            });
        };
        voice.onchange = function () {
          state.voice = voice.value;
          save();
        };
        rate.value = state.rate || 1;
        rateOut.value = Number(rate.value).toFixed(1);
        rate.oninput = function () {
          state.rate = Number(rate.value);
          rateOut.value = state.rate.toFixed(1);
          save();
        };
        large.checked = !!state.large;
        document.body.classList.toggle("large", !!state.large);
        large.onchange = function () {
          state.large = large.checked;
          document.body.classList.toggle("large", state.large);
          save();
        };
        if ("speechSynthesis" in window)
          speechSynthesis.onvoiceschanged = loadVoices;
        renderCats();
        renderBoard();
        renderMessage();
      })();
    </script>
  </body>
</html>
